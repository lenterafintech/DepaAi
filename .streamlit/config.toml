# Konfigurasi untuk Streamlit Community Cloud. Port 8501 dipertahankan di sini
# karena layanan hosting memeriksa kesehatan aplikasi pada port itu; mengunci
# 8503 membuat aplikasi berjalan di port yang tidak diperiksa, sehingga penerapan
# gagal dengan pesan "dial tcp 127.0.0.1:8501: connect: connection refused".
#
# Untuk menjalankan di komputer sendiri pada port 8503 tanpa mengetik apa pun,
# pakai skrip jalankan.cmd (Windows) atau jalankan.sh (Linux/macOS) di akar
# proyek. Keduanya memberi --server.port 8503 pada baris perintah, yang
# mengalahkan berkas ini secara lokal tanpa mengganggu penerapan.
[server]
port = 8501
headless = true
address = "0.0.0.0"

[browser]
gatherUsageStats = false

# Palet "modern SaaS analytics" (acuan Vercel/Stripe/Linear): latar netral
# lembut, aksen biru listrik. Warna status (hijau/amber/merah) didefinisikan
# di nalardata/ui.py karena Streamlit hanya menyediakan satu warna aksen di sini.
[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
linkColor = "#2563eb"
borderColor = "#e2e8f0"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseRadius = "medium"
