# Port sengaja TIDAK dikunci di berkas ini. Layanan hosting (Streamlit Community
# Cloud, Hostinger VPS di balik proksi) memeriksa kesehatan aplikasi pada port
# bawaannya sendiri; mengunci port di sini membuat aplikasi berjalan di port lain
# daripada yang diperiksa, sehingga penerapan dinyatakan gagal.
#
# Untuk menjalankan di komputer sendiri pada port 8503 tanpa mengetik apa pun,
# pakai skrip jalankan.cmd (Windows) atau jalankan.sh (Linux/macOS) di akar proyek.

[browser]
gatherUsageStats = false

# Palet laporan keuangan: netral berbias biru dengan aksen navy. Warna status
# (hijau/amber/merah bata) didefinisikan di lentera_mva/ui.py karena Streamlit
# hanya menyediakan satu warna aksen di sini.
[theme]
base = "light"
primaryColor = "#26356b"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6fb"
textColor = "#131a2b"
linkColor = "#3b4ea0"
borderColor = "#dde3ee"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseRadius = "medium"
